  html.touch #help{display:none} html.touch #fs{display:block}
  html.touch #app{position:fixed;top:0;left:0;width:100vw;width:100dvw;height:100vh;height:100dvh;display:block;overflow:hidden}
  html.touch canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:0;box-shadow:none;
    width:min(100vw,calc(100vh*1.4210));width:min(100dvw,calc(100dvh*1.4210))}
  html.touch .pad{display:flex;position:absolute;bottom:max(8px,env(safe-area-inset-bottom));z-index:3;visibility:hidden;opacity:.88;--s:clamp(46px,17vh,76px);--s:clamp(46px,17dvh,76px)}

  html.touch .grp{gap:calc(var(--s)*.14)}
  html.touch .tb{min-width:var(--s);min-height:var(--s);font-size:clamp(12px,calc(var(--s)*.24),17px)}
  html.touch .grp.move{grid-template-columns:repeat(2,calc(var(--s)*1.15))} html.touch .grp.move .tb{min-height:calc(var(--s)*1.25)}
  html.touch .grp.act{grid-template-columns:repeat(2,var(--s))} html.touch .grp.act .hit{min-height:calc(var(--s)*1.2)}

  @media (orientation:portrait){

    html.touch .pad{--s:clamp(46px,17vw,76px);--s:clamp(46px,17dvw,76px)}
    html.touch #fs{top:auto;bottom:8px}
  }

// ======================= AI =======================
function predictLanding(b) {
  let x = b.x, y = b.y, vx = b.vx, vy = b.vy;
  for (let i = 0; i < 400; i++) {
    vy += 0.25; x += vx; y += vy;
    if (x < BR || x > W - BR) vx = -vx;
    if (y >= GROUND - BR) return x;
  }
  return x;
}
function aiInput(p) {
  const inp = { ...NOINPUT }, c = p.aiCfg;
  if (state !== 'play') return inp;
  if (frame % c.every === 0) {
    const incoming = ball.x > NET_X - 20 || ball.vx > 0.5;
    p.aiTarget = incoming ? predictLanding(ball) + (Math.random() - 0.5) * c.err + (ball.x > NET_X ? 8 : 0) : W * 0.78;
    p.aiTarget = Math.max(NET_X + NET_W / 2 + PR, Math.min(W - PR, p.aiTarget));
  }
  if (p.x < p.aiTarget - 6) inp.right = true; else if (p.x > p.aiTarget + 6) inp.left = true;
  const dx = ball.x - p.x, dy = ball.y - p.y;
  if (ball.x > NET_X && p.onGround && Math.abs(dx) < 70 && dy < -20 && dy > -150 && ball.vy > -2 && Math.random() < c.jump) inp.jump = true;
  if (Math.hypot(dx, dy) < PR + BR + 22) {
    if (!p.onGround && Math.random() < 0.4) inp.spike = true;
    if (p.energy >= 100 && Math.random() < c.skill) inp.skill = true;
  }
  if (p.onGround && ball.x > NET_X && ball.y > GROUND - 70 && ball.vy > 0 && Math.abs(dx) > 38 && Math.abs(dx) < 95 && Math.random() < c.dive) {
    inp.spike = true; inp.left = dx < 0; inp.right = dx > 0;
  }

}

function updatePlayer(p, inp) {
  const m = p.mon;
  if (p.stun > 0) { p.stun--; inp = NOINPUT; }
  if (p.recover > 0) { p.recover--; inp = NOINPUT; }
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (inp.spike && dir !== 0 && p.onGround && p.dive <= 0) {   // 地面 + 方向 + 擊球 = 撲球
    p.diveDir = dir; p.face = dir; p.dive = DIVE_T; p.vy = -4.5; p.onGround = false;
    dust(p.x, GROUND, dir); beep(260, 0.18, 'sawtooth', 0.05, 220);
  }
  if (p.dive > 0) {
    p.dive--; p.vx = p.diveDir * (3 + 7 * p.dive / DIVE_T);
    if (p.dive === 0) p.recover = 14;
    if (p.onGround && frame % 3 === 0) dust(p.x, GROUND, p.diveDir);
  } else {
    p.vx = dir * m.speed * p.speedMul * (p.slow > 0 ? 0.6 : 1);
    if (dir) p.face = dir;

    if (inp.spike && p.spikeT <= 0) p.spikeT = 14;

  if (inp.skill && p.energy >= 100 && p.skillT <= 0 && p.dive <= 0) { p.skillT = 16; beep(300, 0.15, 'sawtooth', 0.05, 400); }
  p.vy += 0.55; p.x += p.vx; p.y += p.vy;

    if (!p.onGround && p.vy > 3.5) { p.landT = 8; dust(p.x, GROUND); }
    p.y = GROUND - PR; p.vy = 0; p.onGround = true;
  }
  const minX = p.side === 0 ? PR : NET_X + NET_W / 2 + PR, maxX = p.side === 0 ? NET_X - NET_W / 2 - PR : W - PR;
  p.x = Math.max(minX, Math.min(maxX, p.x));
  if (p.spikeT > 0) p.spikeT--;
  if (p.skillT > 0) p.skillT--;
  if (p.hitCd > 0) p.hitCd--;
  if (p.landT > 0) p.landT--;
  if (p.slow > 0) { p.slow--; if (frame % 6 === 0) particles.push({ x: p.x + (Math.random() - 0.5) * 24, y: p.y - 10, vx: 0, vy: 1.2, life: 16, color: FXCOLOR.water, size: 3 }); }
  p.energy = Math.min(100, p.energy + 0.06);
  if (p.energy >= 100 && frame % 8 === 0) particles.push({ x: p.x + (Math.random() - 0.5) * 30, y: p.y - 20, vx: 0, vy: -1, life: 20, color: FXCOLOR[m.id], size: 3 });

// 水砲：解出「剛好越過網頂、並落在對手場地中後段」的拋物線（重力 0.4）；解不出來才退回保守彈道

function awardPoint(winner, key) {

}

function hitBall(p) {

  if (ball.fx === 'grass') { g = 0.05; ball.vy += Math.sin(ball.t * 0.18) * 0.22; ball.vx += Math.cos(ball.t * 0.13) * 0.08; }
  if (ball.fx === 'elec') { g = 0.15; if (ball.t % 14 === 0) ball.vy += (Math.random() - 0.5) * 12; }
  ball.vy += g;

// ======================= 主要更新 =======================
function update() {
  frame++;
  const g = (state === 'play' || state === 'point' || state === 'over' || state === 'pause') ? '1' : '0';
  if (document.body.dataset.game !== g) document.body.dataset.game = g;
  const def = menuDef();
  if (net.role === 'guest' && (state === 'play' || state === 'point' || state === 'over')) {   // 訪客：只送出輸入，畫面由房主快照決定
    if (state === 'over' && def) { if (overT > 0) overT--; else menuKeys(def); }
    return;
  }
  if (def && state !== 'over') { menuKeys(def); return; }
  if (state === 'pick') { pickKeys(); return; }
  if (state === 'intro') { timer--; if (net.role !== 'guest' && (timer <= 0 || (!net.role && timer < 90 && hit(K_OK)))) { startMatch(); } return; }
  if (state === 'over' && def) { if (overT > 0) overT--; else menuKeys(def); }
  else if ((state === 'play' || state === 'point') && (pressed['Escape'] || pressed['p'])) { doPause(); return; }
  if (state === 'play' && hitstop > 0) { hitstop--; return; }
  const inps = [readInput(0), readInput(1)];
  players.forEach((p, i) => updatePlayer(p, inps[i]));
  if (serveMsgT > 0) serveMsgT--;
  if (hintT > 0) hintT--;
  if (state === 'play') { players.forEach(hitBall); if (state === 'play') updateBall(); }
  else if (state === 'point' || state === 'over') {

    if (ball.y < GROUND - BR) { ball.vy += 0.4; ball.y = Math.min(GROUND - BR, ball.y + ball.vy); ball.x += ball.vx; }
    if (state === 'point' && --timer <= 0) startServe();
  }
}

function drawPick() {
  drawBackdrop(0.6);
  text(mode === 1 || net.role ? t('pickTitle1') : t('pickTitle', { n: pickStep + 1 }), W / 2, 34, 18, '#ffd23f');
  MONS.forEach((m, i) => {
    const x = cardX(i), sel = cursor[pickStep] === i;
    ctx.fillStyle = sel ? '#ffffff45' : '#ffffff18'; ctx.fillRect(x - 46, 48, 92, 104);
    if (sel) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.strokeRect(x - 46, 48, 92, 104); }
    drawSprite(m.id, x, 128 - (sel ? Math.abs(Math.sin(frame * 0.12)) * 6 : 0), SPRITE_K, 1);
    text(mn(m), x, 146, 12);
    if (!net.role && pickStep === 1 && picks[0] === i) text('P1', x - 36, 62, 11, '#7cf', 'left');
  });
  const m = MONS[cursor[pickStep]];
  ctx.fillStyle = '#00000070'; ctx.fillRect(16, 160, W - 32, 100);
  text(m.sk[S.lang], 28, 180, 15, FXCOLOR[m.id], 'left'); text(t('skill'), W - 28, 180, 10, '#ffffff99', 'right');
  wrap(m.desc[S.lang], 230, 11).slice(0, 3).forEach((l, i) => text(l, 28, 200 + i * 15, 11, '#fff', 'left'));
  [[t('speed'), m.speed / 5], [t('jump'), (m.jump - 9) / 5]].forEach(([lab, v], i) => {
    const y = 192 + i * 24; text(lab, W - 150, y + 8, 10, '#fff', 'left');
    ctx.fillStyle = '#1d1a2b'; ctx.fillRect(W - 102, y, 78, 10); ctx.fillStyle = FXCOLOR[m.id]; ctx.fillRect(W - 101, y + 1, Math.round(76 * Math.min(1, v)), 8);
  });
  const b = pickBtnRects();
  [[b.back, t('back')], [b.ok, t('ok')]].forEach(([r, lab], i) => { ctx.fillStyle = i ? '#ffd23f' : '#ffffff30'; ctx.fillRect(r.x, r.y, r.w, r.h); text(lab, r.x + r.w / 2, r.y + 18, 13, i ? '#1d1a2b' : '#fff'); });
  text(t('pickHint'), W / 2, 288, 10, '#ffffffaa');
}
function drawIntro() {
  drawBackground(false);
  const a = MONS[picks[0]], b = MONS[picks[1]], k = 3, e = Math.min(1, (120 - timer) / 20), ease = 1 - Math.pow(1 - e, 3);
  ctx.fillStyle = '#00000050'; ctx.fillRect(0, 70, W, 150);
  drawSprite(a.id, -80 + (W * 0.27 + 80) * ease, 215, k, 1); drawSprite(b.id, W + 80 - (W * 0.27 + 80) * ease, 215, k, -1);
  text(t('vs'), W / 2, 160, 40, '#ffd23f');
  text('P1', W * 0.27, 96, 14, '#7cf'); text(mn(a), W * 0.27, 242, 16);
  text(mode === 1 ? t('cpu') : 'P2', W * 0.73, 96, 14, '#f99'); text(mn(b), W * 0.73, 242, 16);
  if (timer < 90) text(t('skip'), W / 2, 288, 10, '#ffffffaa');
}
function drawOnline() {
  drawBackdrop(0.55); text(t('online'), W / 2, 80, 24, '#ffd23f');
  if (net.err) text(t(net.err), W / 2, 112, 12, '#ff8a8a');
  drawMenu(menuDef()); text(t('netNote'), W / 2, 288, 10, '#ffffffaa');
}
function drawNetWait() {
  drawBackdrop(0.6); text(t('online'), W / 2, 70, 22, '#ffd23f');
  if (net.status === 'waitJoin') { text(t('roomCode'), W / 2, 120, 14, '#ffffffcc'); text(net.code, W / 2, 175, 44, '#ffd23f'); text(t('shareCode'), W / 2, 205, 12); }
  else text(t(net.status === 'waitPick' ? 'waitPick' : 'connecting'), W / 2, 150, 16);
  drawMenu(menuDef());
}
function dimOverlay() { ctx.fillStyle = '#000000a0'; ctx.fillRect(0, 0, W, H); }

function draw() {
  ctx.save();
  if (shake > 0 && (state === 'play' || state === 'point' || state === 'over')) { ctx.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake)); shake *= 0.85; if (shake < 0.5) shake = 0; }
  switch (state) {
    case 'title': drawTitle(); break;
    case 'settings': settingsReturn === 'pause' ? (drawGameScene(), dimOverlay(), drawMenu(menuDef(), t('settings'))) : drawSettings(); break;
    case 'howto': drawHowto(); break;
    case 'online': drawOnline(); break;
    case 'netwait': drawNetWait(); break;
    case 'pick': drawPick(); break;
    case 'intro': drawIntro(); break;
    case 'pause': drawGameScene(); dimOverlay(); drawMenu(menuDef(), t('paused')); break;
    case 'over': drawGameScene(); dimOverlay(); text(msg(), W / 2, 100, 26, '#ffd23f'); text(`${scores[0]} - ${scores[1]}`, W / 2, 128, 18); drawMenu(menuDef()); break;
    default: drawGameScene();
  }
  ctx.restore();
}

// ======================= 指標（滑鼠 / 觸控）=======================
cv.tabIndex = 0;
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const portraitMQ = matchMedia('(orientation:portrait)');
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  if (IS_TOUCH && portraitMQ.matches) return [(e.clientY - r.top) / r.height * W, (r.right - e.clientX) / r.width * H];   // 版面旋轉 90°
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
function itemAt(def, x, y) { for (let i = 0; i < def.items.length; i++) if (inRect(x, y, itemRect(def, i))) return i; return -1; }
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const def = menuDef(); if (!def) return; const [x, y] = toLogical(e), i = itemAt(def, x, y); if (i >= 0) focus = i;
});
cv.addEventListener('pointerdown', e => {
  cv.focus(); window.focus();
  const [x, y] = toLogical(e), def = menuDef();
  if (state === 'title' && inRect(x, y, langBtnRect())) { cycleLang(1); beep(520, 0.05); return; }
  if (def) {
    if (state === 'over' && overT > 0) return;
    const i = itemAt(def, x, y);
    if (i >= 0) { focus = i; const it = def.items[i], r = itemRect(def, i); activate(it, it.adj && x < r.x + r.w * 0.4 ? -1 : 1); }
    return;
  }
  if (state === 'pick') {
    const b = pickBtnRects();
    if (inRect(x, y, b.back)) { backPick(); return; }
    if (inRect(x, y, b.ok)) { confirmPick(); return; }
    for (let i = 0; i < 4; i++) if (x > cardX(i) - 46 && x < cardX(i) + 46 && y > 48 && y < 152) { if (cursor[pickStep] === i) confirmPick(); else { cursor[pickStep] = i; beep(480, 0.03); } }
    return;
  }
  if (state === 'intro' && timer < 90) { startMatch(); return; }
  if ((state === 'play' || state === 'point') && y < 34 && Math.abs(x - W / 2) < 26) doPause();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) doPause(); });

// ======================= 手機虛擬按鈕 =======================
const padL = document.getElementById('padL'), padR = document.getElementById('padR');
function setKey(p, act, down) {
  const k = KEYMAP[p][act];
  if (down) { if (!keys[k]) pressed[k] = true; keys[k] = true; } else keys[k] = false;
}
function mkBtn(parent, p, act, label, cls) {
  const b = document.createElement('button'); b.className = 'tb ' + cls; b.textContent = label; b.type = 'button';
  const up = () => { setKey(p, act, false); b.classList.remove('on'); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} setKey(p, act, true); b.classList.add('on'); if (navigator.vibrate) try { navigator.vibrate(8); } catch (_) {} });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
  b.addEventListener('contextmenu', e => e.preventDefault());
  parent.appendChild(b); return b;
}
function div(c) { const d = document.createElement('div'); d.className = c; return d; }
function buildPads() {
  const single = mode === 1 || !!net.role;
  for (const k in keys) keys[k] = false;
  padL.innerHTML = ''; padR.innerHTML = '';
  if (single) {
    const m = div('grp move'); mkBtn(m, 0, 'left', '◀', 'dir'); mkBtn(m, 0, 'right', '▶', 'dir'); padL.appendChild(m);
    const a = div('grp act'); mkBtn(a, 0, 'jump', t('bJump'), 'jump'); mkBtn(a, 0, 'skill', t('bSkill'), 'skill'); mkBtn(a, 0, 'spike', t('bHit'), 'hit'); padR.appendChild(a);
  } else {
    [[0, padL], [1, padR]].forEach(([p, pad]) => {
      const g = div('grp p2'); mkBtn(g, p, 'jump', t('bJump'), 'jump'); mkBtn(g, p, 'spike', t('bHit'), 'hit'); mkBtn(g, p, 'skill', t('bSkill'), 'skill');
      mkBtn(g, p, 'left', '◀', 'dir'); mkBtn(g, p, 'right', '▶', 'dir'); pad.appendChild(g);
    });
  }
}

// ======================= 語言套用 / 全螢幕 =======================
const fsBtn = document.getElementById('fs');
function applyLang() {
  document.documentElement.lang = HTML_LANG[S.lang];
  document.title = t('title');
  document.getElementById('help').textContent = t('helpDesk');
  document.getElementById('rot').textContent = t('rotate');
  fsBtn.textContent = '⛶ ' + t('fs');
  buildPads();
}
const canFs = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
if (!canFs) fsBtn.style.display = 'none';
fsBtn.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else { await (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }
  } catch (e) {}
});

// ======================= 主迴圈 =======================
applyLang();
setInterval(() => { update(); netTick(); for (const k in pressed) delete pressed[k]; }, 1000 / 60);
(function render() { draw(); requestAnimationFrame(render); })();
setInterval(draw, 50);
</script>
