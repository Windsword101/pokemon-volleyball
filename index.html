const BALL_ART = [
  '....KKKKKK....', '..KKRRRRRRKK..', '.KRHHRRRRRRRK.', '.KRHRRRRRRRRK.', 'KRRRRRRRRRRRRK', 'KRRRRKKKKRRRRK', 'KKKKKKWWKKKKKK',

];
const ballCache = {};
function ballSprite(color) {
  if (ballCache[color]) return ballCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 14; const g = c.getContext('2d');
  const pal = { K: '#1d1a2b', R: color, W: '#ffffff', S: '#c4cbdb', H: '#ffffff' };
  BALL_ART.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return ballCache[color] = c;
}
const DIGITS = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001001001', '111101111101111', '111101111001111'];
function drawDigits(n, x, y, cell, align) {
  const s = String(n), wd = s.length * (3 * cell + cell) - cell;
  let cx = align === 'right' ? x - wd : x;
  for (const ch of s) {
    const d = DIGITS[+ch];
    for (let i = 0; i < 15; i++) if (d[i] === '1') {
      const px = cx + (i % 3) * cell, py = y + Math.floor(i / 3) * cell;
      ctx.fillStyle = '#1d1a2b'; ctx.fillRect(px + 1, py + 1, cell, cell);
      ctx.fillStyle = '#fff'; ctx.fillRect(px, py, cell, cell);
    }
    cx += 4 * cell;
  }
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = 4; ctx.strokeStyle = '#1d1a2b'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function wrap(str, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const out = []; let line = '';
  const tokens = str.includes(' ') ? str.split(/(?<= )/) : [...str];
  for (const tk of tokens) {
    const test = line + tk;
    if (ctx.measureText(test).width > maxW && line) { out.push(line.trimEnd()); line = tk; } else line = test;
  }
  if (line) out.push(line.trimEnd());
  return out;
}

let actx = null;
function beep(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0) {
  if (net.role === 'host' && !net.replay) net.events.push(['b', freq, dur, type, vol, slide]);
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
window.addEventListener('pointerdown', () => { try { if (screen.orientation && screen.orientation.lock && IS_TOUCH) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {} }, { passive: true });

const mkTrack = src => { const au = new Audio(src); au.loop = true; au.preload = 'auto'; au.volume = 0; return { au, g: null, lvl: 0 }; };

let bgmUnlocked = false, bgmTrying = false, bgmGraph = false;
function bgmSetupGraph() {
  if (bgmGraph) return; bgmGraph = true;
  if (!/^https?:/.test(location.protocol)) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    TRACKS.forEach(tr => { const src = actx.createMediaElementSource(tr.au), g = actx.createGain(); g.gain.value = 0; src.connect(g); g.connect(actx.destination); tr.au.volume = 1; tr.g = g; });
  } catch (e) { TRACKS.forEach(tr => { tr.g = null; tr.au.volume = 0; }); }
}

}

function updateBall() {
  ball.t++;
  let g = 0.25;
  if (ball.fx === 'fire') g = 0.06;
  if (ball.fx === 'rock') g = 0.15;
  if (ball.fx === 'psy' && ball.psyT > 0) {   // 念力操控：施放者的 左/右/跳 鍵微調球速
    ball.psyT--; g = 0.12;
    const ci = lastIn[ball.psyOwner];
    if (ci) { ball.vx += ((ci.right ? 1 : 0) - (ci.left ? 1 : 0)) * 0.5; if (ci.jump) ball.vy -= 0.45; }

  if (ball.fx === 'water') g = 0.4;
  if (ball.fx === 'grass') { g = 0.05; ball.vy += Math.sin(ball.t * 0.18) * 0.22; ball.vx += Math.cos(ball.t * 0.13) * 0.08; }
  if (ball.fx === 'elec') { g = 0.15; if (ball.t % 14 === 0) ball.vy += (Math.random() - 0.5) * 12; }
  ball.vy += g;
  let sp = Math.hypot(ball.vx, ball.vy), cap = ball.fx === 'fire' ? 22 : 18;
  if (ball.fx === 'grass') cap = 6.5;
  if (ball.fx === 'psy') cap = 11;
  if (sp > cap) { ball.vx *= cap / sp; ball.vy *= cap / sp; }
  ball.x += ball.vx; ball.y += ball.vy; ball.spin += ball.vx * 0.05;
  ball.trail.push({ x: ball.x, y: ball.y }); if (ball.trail.length > 6) ball.trail.shift();
  if (ball.fx && frame % 2 === 0) burst(ball.x, ball.y, FXCOLOR[ball.fx], 2, 1.2);
  if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx) * 0.9; }
  if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) * 0.9; }
  if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy) * 0.8; }
  const nx0 = NET_X - NET_W / 2, nx1 = NET_X + NET_W / 2;
  const cx = Math.max(nx0, Math.min(nx1, ball.x)), cy = Math.max(NET_TOP, Math.min(GROUND, ball.y));
  let ddx = ball.x - cx, ddy = ball.y - cy, dd = Math.hypot(ddx, ddy);
  if (dd < BR) {
    if (dd === 0) { ddx = ball.x < NET_X ? -1 : 1; ddy = 0; dd = 1; }
    const nx = ddx / dd, ny = ddy / dd, dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) { ball.vx -= 1.8 * dot * nx; ball.vy -= 1.8 * dot * ny; }
    ball.x = cx + nx * BR; ball.y = cy + ny * BR; beep(200, 0.05, 'triangle', 0.05);
  }
  if (ball.y >= GROUND - BR) {
    awardPoint(ball.x < NET_X ? 1 : 0, 'scores');
    burst(ball.x, GROUND, ball.fx ? FXCOLOR[ball.fx] : '#fff', 30, 5, 2); dust(ball.x, GROUND); beep(130, 0.3, 'sawtooth', 0.08, -60);
    ball.y = GROUND - BR; ball.vx = ball.vy = 0; ball.fx = null;
  }
}

// ======================= 主要更新 =======================
function update() {
  frame++;
  bgmTick();
  const g = (state === 'play' || state === 'point' || state === 'over' || state === 'pause') ? '1' : '0';
  if (document.body.dataset.game !== g) document.body.dataset.game = g;
  const def = menuDef();
  if (net.role === 'guest' && (state === 'play' || state === 'point' || state === 'over')) {   // 訪客：只送出輸入，畫面由房主快照決定
    if (state === 'over' && def) { if (overT > 0) overT--; else menuKeys(def); }
    return;
  }
  if (def && state !== 'over') { menuKeys(def); return; }
  if (state === 'pick') { pickKeys(); return; }
  if (state === 'intro') { timer--; if (net.role !== 'guest' && (timer <= 0 || (!net.role && timer < 90 && hit(K_OK)))) { startMatch(); } return; }
  if (state === 'over' && def) { if (overT > 0) overT--; else menuKeys(def); }
  else if ((state === 'play' || state === 'point') && (pressed['Escape'] || pressed['p'])) { doPause(); return; }
  if (state === 'play' && hitstop > 0) { hitstop--; return; }
  const inps = [readInput(0), readInput(1)];
  lastIn = inps;
  players.forEach((p, i) => updatePlayer(p, inps[i]));
  if (serveMsgT > 0) serveMsgT--;
  if (hintT > 0) hintT--;
  if (state === 'play') { players.forEach(hitBall); if (state === 'play') updateBall(); }
  else if (state === 'point' || state === 'over') {
    const w = players[scores[0] > scores[1] ? 0 : 1];
    if (w.onGround && frame % 24 === 0) { w.vy = -7.5; w.onGround = false; }
    if (ball.y < GROUND - BR) { ball.vy += 0.4; ball.y = Math.min(GROUND - BR, ball.y + ball.vy); ball.x += ball.vx; }
    if (state === 'point' && --timer <= 0) startServe();
  }
}

  if (hit(K_RIGHT)) { cursor[step] = (cursor[step] + 1) % nMons(); beep(480, 0.03); }

  ctx.globalAlpha = 1;
  if (p.stun > 0) { ctx.fillStyle = '#ffe84a'; for (let i = 0; i < 3; i++) { const a = frame * 0.2 + i * 2.1; ctx.fillRect(Math.round(p.x + Math.cos(a) * 20), Math.round(p.y - 30 + Math.sin(a) * 6), 4, 4); } }
  if (p.spikeT > 0 || p.skillT > 0) {
    ctx.strokeStyle = p.skillT > 0 ? FXCOLOR[id] : '#fff'; ctx.lineWidth = 3; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + BR + (p.skillT > 0 ? 12 : 0), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function cloud(x, y) {
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 8, y, 24, 8); ctx.fillRect(x, y + 8, 40, 8); ctx.fillRect(x + 4, y + 16, 32, 4);
  ctx.fillStyle = '#d6ecff'; ctx.fillRect(x + 4, y + 16, 32, 4);
}
function drawBackground(withNet = true) {
  const top = [0x3f, 0x9a, 0xff], bot = [0xbd, 0xe8, 0xff];
  for (let y = 0; y < GROUND; y += 16) {
    const tt = Math.min(1, y / GROUND);
    ctx.fillStyle = `rgb(${top.map((c, k) => Math.round(c + (bot[k] - c) * tt)).join(',')})`; ctx.fillRect(0, y, W, 16);
  }
  for (let i = 0; i < 4; i++) cloud(Math.round(((frame * 0.12 + i * 120) % (W + 80)) - 60), 26 + (i % 2) * 44 + (i === 2 ? 10 : 0));
  for (let x = 0; x < W; x += 8) {
    const h1 = 46 + 22 * Math.sin(x * 0.021 + 0.5) + 12 * Math.sin(x * 0.06), h2 = 22 + 12 * Math.sin(x * 0.04 + 2);
    ctx.fillStyle = '#7fa6e6'; ctx.fillRect(x, GROUND - Math.round(h1 / 4) * 4, 8, h1 + 8);
    ctx.fillStyle = '#4a74c9'; ctx.fillRect(x, GROUND - Math.round(h2 / 4) * 4, 8, h2 + 8);
  }
  ctx.fillStyle = '#3fa84a'; ctx.fillRect(0, GROUND, W, 8);
  ctx.fillStyle = '#2d8a3a'; for (let x = 0; x < W; x += 8) ctx.fillRect(x + ((x / 8) % 2) * 3, GROUND + 4, 4, 4);
  for (let y = GROUND + 8, r = 0; y < H; y += 8, r++) for (let x = 0; x < W; x += 8) { ctx.fillStyle = ((x / 8 + r) % 2) ? '#c98d4f' : '#bd8044'; ctx.fillRect(x, y, 8, 8); }
  if (!withNet) return;
  ctx.fillStyle = '#1d1a2b'; ctx.fillRect(NET_X - NET_W / 2 - 1, NET_TOP - 1, NET_W + 2, GROUND - NET_TOP + 1);
  ctx.fillStyle = '#fff'; ctx.fillRect(NET_X - NET_W / 2, NET_TOP, NET_W, GROUND - NET_TOP);
  ctx.fillStyle = '#c4cbdb'; for (let y = NET_TOP + 8; y < GROUND; y += 8) ctx.fillRect(NET_X - NET_W / 2, y, NET_W, 2);
  ctx.fillStyle = '#e44'; ctx.fillRect(NET_X - NET_W / 2 - 1, NET_TOP, NET_W + 2, 6);
}
function drawBallAt(x, y, color, spin, glow) {
  const s = ballSprite(color), size = 14 * 2.5;
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(Math.round(x), Math.round(y));
  ctx.rotate(Math.round(spin / (Math.PI / 8)) * (Math.PI / 8));
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 12; }
  ctx.drawImage(s, -size / 2, -size / 2, size, size); ctx.restore();
}
function drawBall() {
  const hgt = Math.max(0, (GROUND - ball.y) / 250);
  ctx.fillStyle = '#00000050'; ctx.beginPath(); ctx.ellipse(ball.x, GROUND + 3, 12 - hgt * 6, 3, 0, 0, 6.283); ctx.fill();
  const col = ball.fx ? FXCOLOR[ball.fx] : '#e5383b', spd = Math.hypot(ball.vx, ball.vy);
  if (spd > 11 || ball.fx) ball.trail.forEach((tr, i) => { ctx.globalAlpha = (i + 1) / ball.trail.length * 0.35; drawBallAt(tr.x, tr.y, col, 0, false); });
  ctx.globalAlpha = 1;
  drawBallAt(ball.x, ball.y, col, ball.spin, !!ball.fx);
  if (ball.psyT > 0) { ctx.strokeStyle = FXCOLOR.psy; ctx.lineWidth = 2; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(Math.round(ball.x), Math.round(ball.y), BR + 4 + Math.sin(frame * 0.4) * 3, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
}
function drawHUD() {
  drawDigits(scores[0], 20, 12, 6, 'left'); drawDigits(scores[1], W - 20, 12, 6, 'right');
  for (let i = 0; i < 2; i++) {
    const bx = i === 0 ? 14 : W - 14 - 110, e = players[i].energy, full = e >= 100;
    ctx.fillStyle = '#1d1a2b'; ctx.fillRect(bx - 2, 48, 114, 12);
    for (let s = 0; s < 10; s++) {
      ctx.fillStyle = e >= (s + 1) * 10 ? (full ? (frame % 20 < 10 ? '#fff' : FXCOLOR[players[i].mon.id]) : '#ffd23f') : '#3b3a52';
      ctx.fillRect(bx + s * 11, 50, 9, 8);
    }
    text(mn(players[i].mon) + (full ? '  ' + t('skillReady') : ''), i === 0 ? bx : bx + 110, 76, 12, '#fff', i === 0 ? 'left' : 'right');
  }
  if ((state === 'play' || state === 'point') && !net.role) {  // 暫停鈕
    ctx.fillStyle = '#1d1a2b'; ctx.fillRect(W / 2 - 12, 6, 24, 18); ctx.fillStyle = '#fff'; ctx.fillRect(W / 2 - 5, 10, 4, 10); ctx.fillRect(W / 2 + 1, 10, 4, 10);
  }
  if (rally >= 3 && state === 'play') text(t('rally', { n: rally }), W / 2, 44, 14, '#ffd23f');
  if (deuceOn() && scores[0] >= winScore() - 1 && scores[1] >= winScore() - 1) {   // 平手 / 賽末點提示
    const lead = scores[0] - scores[1];
    text(lead === 0 ? t('deuceHud') : t('advHud', { name: mn(players[lead > 0 ? 0 : 1].mon) }), W / 2, rally >= 3 && state === 'play' ? 62 : 46, 11, lead === 0 ? '#ff9a9a' : '#ffe84a');
  }
  if (state === 'point') text(msg(), W / 2, 130, 24);
  if (serveMsgT > 0 && state === 'play') text(serveMsgT > 30 ? t('ready') : t('go'), W / 2, 130, 28, serveMsgT > 30 ? '#fff' : '#ffd23f');
  if (hintT > 0 && state === 'play') { ctx.globalAlpha = Math.min(1, hintT / 30); text(t('hint'), W / 2, 160, 11, '#ffffffdd'); ctx.globalAlpha = 1; }
}
function drawGameScene() {
  drawBackground(); players.forEach(drawMon); drawBall();
  particles.forEach(p => {
    if (!(state === 'play' && hitstop > 0) && state !== 'pause') { p.x += p.vx; p.y += p.vy; p.life--; }
    ctx.globalAlpha = Math.min(1, p.life / 12); ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  });
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0);
  popups.forEach(p => { if (state !== 'pause') { p.y -= 0.5; p.life--; } ctx.globalAlpha = Math.min(1, p.life / 12); text(p.str, p.x, p.y, 14, p.color); });
  ctx.globalAlpha = 1; popups = popups.filter(p => p.life > 0);
  drawHUD();
}

// ======================= 繪圖：各畫面 =======================
const TITLE_MONS = [['elec', 40, 1], ['water', 92, 1], ['fire', W - 92, -1], ['grass', W - 40, -1]];
function drawBackdrop(dim = 0.45) {
  drawBackground(false);
  TITLE_MONS.forEach(([id, x, f], i) => { const hop = Math.max(0, Math.sin(frame * 0.06 + i * 1.6)) * 14; drawSprite(id, x, GROUND + 3 - hop, SPRITE_K, f); });
  ctx.fillStyle = `rgba(0,0,0,${dim})`; ctx.fillRect(0, 0, W, H);
}
function langBtnRect() { return { x: W - 104, y: 8, w: 96, h: 20 }; }
function drawTitle() {
  drawBackdrop(0.35);
  text(t('title'), W / 2, 66, S.lang === 'en' ? 30 : 38, '#ffd23f'); text(t('subtitle'), W / 2, 90, 11, '#ffffffcc');
  const lr = langBtnRect(); ctx.fillStyle = '#00000080'; ctx.fillRect(lr.x, lr.y, lr.w, lr.h); ctx.strokeStyle = '#ffffff80'; ctx.lineWidth = 1; ctx.strokeRect(lr.x, lr.y, lr.w, lr.h);
  text(LANG_NAME[S.lang] + ' ▸', lr.x + lr.w / 2, lr.y + 15, 11);
  drawMenu(menuDef());
  if (!bgmUnlocked && S.music > 0 && frame % 80 < 56) text('♪ ' + t('tapMusic'), 8, 20, 10, '#ffd23f', 'left');   // 提醒：點一下才會出聲
  if (!IS_TOUCH) text(t('menuHint'), W / 2, 280, 10, '#ffffffaa');
  text(CREDIT, W / 2, 298, 11, '#ffd23f');
}
function drawSettings() { drawBackdrop(0.55); const d = menuDef(); drawMenu(d, t('settings')); if (!IS_TOUCH) text(t('menuHint'), W / 2, 288, 10, '#ffffffaa'); }
function drawHowto() {
  drawBackdrop(0.6); text(t('howto'), W / 2, 44, 22, '#ffd23f');
  ctx.fillStyle = '#00000070'; ctx.fillRect(20, 56, W - 40, 190);
  const lines = [t('ht1'), t('ht2'), t('ht3'), t('ht4'), t('ht5'), t('ht6', { n: S.win }), ...(S.deuce ? [t('ht8')] : []), t('ht7')];
  let y = 82;
  lines.forEach(l => { wrap(l, W - 70, 12).forEach(w => { text(w, 34, y, 12, '#fff', 'left'); y += 15; }); y += 4; });
  drawMenu(menuDef());
}
const cardN = () => nMons();
const cardSpacing = () => cardN() <= 4 ? 103 : Math.floor(412 / cardN());
const cardHalf = () => cardN() <= 4 ? 46 : Math.floor(cardSpacing() / 2) - 3;
function cardX(i) { const n = cardN(), sp = cardSpacing(); return n <= 4 ? 62 + i * 103 : Math.round(10 + (412 - sp * n) / 2 + sp / 2 + i * sp); }
function cardK(m, hw) { const im = IMGS[m.id]; if (!im || !im.naturalWidth) return SPRITE_K; return Math.min(SPRITE_K, (hw * 2 - 8) / im.naturalWidth, 80 / im.naturalHeight); }
function pickBtnRects() { return { back: { x: 8, y: 264, w: 104, h: 32 }, ok: { x: W - 112, y: 264, w: 104, h: 32 } }; }
function drawPick() {
  drawBackdrop(0.6);
  text(mode === 1 || net.role ? t('pickTitle1') : t('pickTitle', { n: pickStep + 1 }), W / 2, 34, 18, '#ffd23f');
  avail().map(i => MONS[i]).forEach((m, i) => {
    const x = cardX(i), sel = cursor[pickStep] === i, hw = cardHalf();
    ctx.fillStyle = sel ? '#ffffff45' : '#ffffff18'; ctx.fillRect(x - hw, 48, hw * 2, 104);
    if (sel) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.strokeRect(x - hw, 48, hw * 2, 104); }
    drawSprite(m.id, x, 128 - (sel ? Math.abs(Math.sin(frame * 0.12)) * 6 : 0), cardK(m, hw), 1);
    text(mn(m), x, 146, hw >= 40 ? 12 : hw >= 32 ? 10 : 9);
    if (!net.role && pickStep === 1 && picks[0] === avail()[i]) text('P1', x - hw + 8, 62, 11, '#7cf', 'left');
  });
  const m = MONS[avail()[cursor[pickStep]]];
  ctx.fillStyle = '#00000070'; ctx.fillRect(16, 160, W - 32, 100);
  text(m.sk[S.lang], 28, 180, 15, FXCOLOR[m.id], 'left'); text(t('skill'), W - 28, 180, 10, '#ffffff99', 'right');
  wrap(m.desc[S.lang], 232, 11).slice(0, 4).forEach((l, i) => text(l, 28, 198 + i * 13.5, 11, '#fff', 'left'));
  [[t('speed'), m.speed / 5], [t('jump'), (m.jump - 9) / 5]].forEach(([lab, v], i) => {
    const y = 192 + i * 24; text(lab, W - 150, y + 8, 10, '#fff', 'left');
    ctx.fillStyle = '#1d1a2b'; ctx.fillRect(W - 102, y, 78, 10); ctx.fillStyle = FXCOLOR[m.id]; ctx.fillRect(W - 101, y + 1, Math.round(76 * Math.min(1, v)), 8);
  });
  const b = pickBtnRects();
  [[b.back, t('back')], [b.ok, t('ok')]].forEach(([r, lab], i) => {
    ctx.fillStyle = i ? '#ffd23f' : '#ffffff30'; ctx.fillRect(r.x, r.y, r.w, r.h);
    if (i) { ctx.font = `14px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#1d1a2b'; ctx.fillText(lab, r.x + r.w / 2, r.y + 21); }   // 黃底深字：不加描邊，否則會糊成一團
    else text(lab, r.x + r.w / 2, r.y + 21, 13);
  });
  if (!IS_TOUCH) text(t('pickHint'), W / 2, 288, 10, '#ffffffaa');
}
function drawIntro() {
  drawBackground(false);
  const a = MONS[picks[0]], b = MONS[picks[1]], k = 3, ka = k * monK(a) / SPRITE_K, kb = k * monK(b) / SPRITE_K, e = Math.min(1, (120 - timer) / 20), ease = 1 - Math.pow(1 - e, 3);
  ctx.fillStyle = '#00000050'; ctx.fillRect(0, 70, W, 150);
  drawSprite(a.id, -80 + (W * 0.27 + 80) * ease, 215, ka, 1); drawSprite(b.id, W + 80 - (W * 0.27 + 80) * ease, 215, kb, -1);
  text(t('vs'), W / 2, 160, 40, '#ffd23f');
  text('P1', W * 0.27, 96, 14, '#7cf'); text(mn(a), W * 0.27, 242, 16);
  text(mode === 1 ? t('cpu') : 'P2', W * 0.73, 96, 14, '#f99'); text(mn(b), W * 0.73, 242, 16);
  if (timer < 90) text(t('skip'), W / 2, 288, 10, '#ffffffaa');
}
function drawOnline() {
  drawBackdrop(0.55); text(t('online'), W / 2, 80, 24, '#ffd23f');
  if (net.err) text(t(net.err), W / 2, 112, 12, '#ff8a8a');
  drawMenu(menuDef()); text(t('netNote'), W / 2, 288, 10, '#ffffffaa');
}
function drawNetWait() {
  drawBackdrop(0.6); text(t('online'), W / 2, 70, 22, '#ffd23f');
  if (net.status === 'waitJoin') { text(t('roomCode'), W / 2, 104, 13, '#ffffffcc'); text(net.code, W / 2, 152, 44, '#ffd23f'); text(t('shareCode'), W / 2, 180, 12); }
  else text(net.joinCode && net.status === 'connecting' ? t('joiningRoom', { code: net.joinCode }) : t(net.status === 'waitPick' ? 'waitPick' : 'connecting'), W / 2, 150, 16);
  drawMenu(menuDef());
  if (toast.t > 0) { toast.t--; ctx.globalAlpha = Math.min(1, toast.t / 20); text(toast.s, W / 2, 196, toast.s.length > 30 ? 9 : 13, '#7be06b'); ctx.globalAlpha = 1; }
}
function dimOverlay() { ctx.fillStyle = '#000000a0'; ctx.fillRect(0, 0, W, H); }

function draw() {
  ctx.save();
  if (shake > 0 && (state === 'play' || state === 'point' || state === 'over')) { ctx.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake)); shake *= 0.85; if (shake < 0.5) shake = 0; }
  switch (state) {
    case 'title': drawTitle(); break;
    case 'settings': settingsReturn === 'pause' ? (drawGameScene(), dimOverlay(), drawMenu(menuDef(), t('settings'))) : drawSettings(); break;
    case 'howto': drawHowto(); break;
    case 'online': drawOnline(); break;
    case 'netwait': drawNetWait(); break;
    case 'pick': drawPick(); break;
    case 'intro': drawIntro(); break;
    case 'pause': drawGameScene(); dimOverlay(); drawMenu(menuDef(), t('paused')); break;
    case 'over': drawGameScene(); dimOverlay(); text(msg(), W / 2, 100, 26, '#ffd23f'); text(`${scores[0]} - ${scores[1]}`, W / 2, 128, 18); drawMenu(menuDef()); break;
    default: drawGameScene();
  }
  if (banner.t > 0) { banner.t--; ctx.globalAlpha = Math.min(1, banner.t / 20); ctx.fillStyle = '#000000b0'; ctx.fillRect(0, 118, W, 34); text(banner.s, W / 2, 141, 15, '#ffd23f'); ctx.globalAlpha = 1; }
  ctx.restore();
}

// ======================= 指標（滑鼠 / 觸控）=======================
cv.tabIndex = 0;
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
let logoTaps = 0, lastLogoTap = 0;
const portraitMQ = matchMedia('(orientation:portrait)');
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  if (IS_TOUCH && portraitMQ.matches) return [(e.clientY - r.top) / r.height * W, (r.right - e.clientX) / r.width * H];   // 版面旋轉 90°
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
// 選項列「◀ 值 ▶」：點 ◀ 那半＝減少、點 ▶ 那半＝增加；點左邊文字區＝往前一格
function optionDir(it, r, x) {
  ctx.font = `14px ${FONT}`;
  const wv = ctx.measureText(`◀ ${it.val()} ▶`).width, start = r.x + r.w - 10 - wv;
  if (x < start) return 1;
  return x < start + wv / 2 ? -1 : 1;
}
function itemAt(def, x, y) { for (let i = 0; i < def.items.length; i++) if (inRect(x, y, itemRect(def, i))) return i; return -1; }
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const def = menuDef(); if (!def) return; const [x, y] = toLogical(e), i = itemAt(def, x, y); if (i >= 0) focus = i;
});
cv.addEventListener('pointerdown', e => {
  cv.focus(); window.focus();
  const [x, y] = toLogical(e), def = menuDef();
  if (state === 'title' && inRect(x, y, langBtnRect())) { cycleLang(1); beep(520, 0.05); return; }
  if (state === 'title' && y < 100 && x > 90 && x < W - 110) { logoTaps = (performance.now() - lastLogoTap < 1200 ? logoTaps : 0) + 1; lastLogoTap = performance.now(); if (logoTaps >= 10) { logoTaps = 0; unlockOnix(); } }
  if (def) {
    if (state === 'over' && overT > 0) return;
    const i = itemAt(def, x, y);
    if (i >= 0) { focus = i; const it = def.items[i], r = itemRect(def, i); activate(it, it.adj ? optionDir(it, r, x) : 1); }
    return;
  }
  if (state === 'pick') {
    const b = pickBtnRects();
    if (inRect(x, y, b.back)) { backPick(); return; }
    if (inRect(x, y, b.ok)) { confirmPick(); return; }
    for (let i = 0; i < nMons(); i++) if (x > cardX(i) - cardHalf() && x < cardX(i) + cardHalf() && y > 48 && y < 152) { if (cursor[pickStep] === i) confirmPick(); else { cursor[pickStep] = i; beep(480, 0.03); } }
    return;
  }
  if (state === 'intro' && timer < 90) { startMatch(); return; }
  if ((state === 'play' || state === 'point') && y < 42 && Math.abs(x - W / 2) < 36) doPause();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) doPause(); });

// ======================= 手機虛擬按鈕 =======================
const padL = document.getElementById('padL'), padR = document.getElementById('padR');
function setKey(p, act, down) {
  const k = KEYMAP[p][act];
  if (down) { if (!keys[k]) pressed[k] = true; keys[k] = true; } else keys[k] = false;
}
function mkBtn(parent, p, act, label, cls) {
  const b = document.createElement('button'); b.className = 'tb ' + cls; b.textContent = label; b.type = 'button';
  const up = () => { setKey(p, act, false); b.classList.remove('on'); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} setKey(p, act, true); b.classList.add('on'); if (navigator.vibrate) try { navigator.vibrate(8); } catch (_) {} });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
  b.addEventListener('contextmenu', e => e.preventDefault());
  parent.appendChild(b); return b;
}
function div(c) { const d = document.createElement('div'); d.className = c; return d; }
function buildPads() {
  const single = mode === 1 || !!net.role;
  for (const k in keys) keys[k] = false;
  padL.innerHTML = ''; padR.innerHTML = '';
  if (single) {
    const m = div('grp move'); mkBtn(m, 0, 'left', '◀', 'dir'); mkBtn(m, 0, 'right', '▶', 'dir'); padL.appendChild(m);
    const a = div('grp act'); mkBtn(a, 0, 'jump', t('bJump'), 'jump'); mkBtn(a, 0, 'skill', t('bSkill'), 'skill'); mkBtn(a, 0, 'spike', t('bHit'), 'hit'); padR.appendChild(a);
  } else {
    [[0, padL], [1, padR]].forEach(([p, pad]) => {
      const g = div('grp p2'); mkBtn(g, p, 'jump', t('bJump'), 'jump'); mkBtn(g, p, 'spike', t('bHit'), 'hit'); mkBtn(g, p, 'skill', t('bSkill'), 'skill');
      mkBtn(g, p, 'left', '◀', 'dir'); mkBtn(g, p, 'right', '▶', 'dir'); pad.appendChild(g);
    });
  }
}

// ======================= 語言套用 / 全螢幕 =======================
const fsBtn = document.getElementById('fs');
function applyLang() {
  document.documentElement.lang = HTML_LANG[S.lang];
  document.title = t('title');
  document.getElementById('help').textContent = t('helpDesk');
  document.getElementById('rot').textContent = t('rotate');
  fsBtn.textContent = '⛶ ' + t('fs');
  buildPads();
}
const canFs = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
if (!canFs) fsBtn.style.display = 'none';
fsBtn.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else { await (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }
  } catch (e) {}
});

// ======================= 主迴圈 =======================
applyLang();
(function autoJoinFromURL() {   // 邀請連結 ?room=1234：開啟後直接加入該房間
  try {
    const q = new URLSearchParams(location.search).get('room');
    if (q && /^\d{4}$/.test(q)) { history.replaceState(null, '', location.pathname); if (typeof Peer !== 'undefined') netJoin(q); else { net.err = 'errLib'; state = 'online'; } }
  } catch (e) {}
})();
setInterval(() => { update(); netTick(); for (const k in pressed) delete pressed[k]; }, 1000 / 60);
(function render() { draw(); requestAnimationFrame(render); })();
setInterval(draw, 50);
</script>
